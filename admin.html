<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INOX PAY — Admin</title><style>body{background:#080e20;color:#f2f7ff;font-family:system-ui;margin:0;padding:25px}.wrap{max-width:900px;margin:auto}h1{color:#54caff}input,button{padding:12px;border-radius:9px;margin:6px;background:#142542;color:white;border:1px solid #385b88}button{cursor:pointer;background:#1659a4}button:disabled{opacity:.5}.item{background:#111d36;border:1px solid #344c70;padding:18px;border-radius:14px;margin:14px 0;overflow-wrap:anywhere}.meta{color:#adbfdd}a{color:#77caff}</style></head><body><main class="wrap"><h1>⚡ INOX PAY — Admin</h1><p><a href="index.html">← Customer page</a></p><section id="login"><p>Sign in with the Firebase Email/Password admin account.</p><input id="email" type="email" placeholder="Admin email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signIn">Sign in</button></section><section id="dashboard" hidden><button id="logout">Sign out</button><button id="refresh">Refresh pending requests</button><h2>Payment requests</h2><div id="requests"></div></section><p id="message" role="status"></p><p class="meta">Approve only after independently matching the UTR, amount and recipient in your BharatPe transaction records. Never approve based on a customer's reference alone.</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,query,orderBy,limit,getDocs,doc,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyAak0vLaqvH35QfydAzSdFcxVbfOsij4CA',authDomain:'inox-pay.firebaseapp.com',projectId:'inox-pay',storageBucket:'inox-pay.firebasestorage.app',messagingSenderId:'687943727320',appId:'1:687943727320:web:e6db5d8dc91200d62a3fad'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),msg=document.getElementById('message'),list=document.getElementById('requests');
document.getElementById('signIn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);document.getElementById('password').value=''}catch(e){msg.textContent=e.message}};
document.getElementById('logout').onclick=()=>signOut(auth);document.getElementById('refresh').onclick=load;
onAuthStateChanged(auth,user=>{document.getElementById('login').hidden=!!user;document.getElementById('dashboard').hidden=!user;list.replaceChildren();if(user)load()});
async function load(){list.replaceChildren();msg.textContent='Loading…';try{const results=await getDocs(query(collection(db,'payments'),orderBy('createdAt','desc'),limit(100)));msg.textContent=results.empty?'No payment requests found.':'Showing up to 100 recent requests.';for(const snap of results.docs){const d=snap.data(),card=document.createElement('article');card.className='item';const title=document.createElement('h3');title.textContent='₹'+(d.amountPaise/100).toFixed(2)+' — '+d.status.toUpperCase();const details=document.createElement('p');details.className='meta';details.textContent='UTR: '+d.utr+' | Request: '+snap.id;card.append(title,details);if(d.status==='pending'){for(const action of ['approved','rejected']){const b=document.createElement('button');b.textContent=action==='approved'?'Approve':'Reject';b.onclick=async()=>{if(!confirm('Have you independently verified this transaction in BharatPe? '+action.toUpperCase()+' this request?'))return;b.disabled=true;try{await updateDoc(doc(db,'payments',snap.id),{status:action,reviewedAt:serverTimestamp()});await load()}catch(e){msg.textContent=e.message;b.disabled=false}};card.append(b)}}list.append(card)}}catch(e){msg.textContent='Cannot load requests: '+e.message+' (check admin UID and Firestore rules).'}}
</script></body></html>
